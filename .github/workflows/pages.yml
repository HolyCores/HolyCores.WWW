name: Build and publish HolyCores website

on:
  push:
    branches: [main]
    paths: ['src/HolyCores.Web/**', 'scripts/**', 'global.json', 'HolyCores.slnx', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holycores-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate and export static website
        shell: pwsh
        run: ./scripts/Publish-Static.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: holycores-pages
          path: artifacts/pages/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: artifacts/pages
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
